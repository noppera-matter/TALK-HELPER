<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020617">
<title>Social Shield v2.8.1</title>
<style>
:root{--bg:#020617;--card:#0f172a;--line:#1e293b;--text:#f1f5f9;--mute:#94a3b8;--dim:#7c8aa0;--ind:#6366f1;--ind2:#818cf8;--green:#34d399;--blue:#60a5fa;--red:#f87171;--orange:#fb923c;--yellow:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:130px;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
.wrap{max-width:448px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
h1{font-size:24px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.ver{font-size:12px;background:var(--ind);padding:2px 8px;border-radius:8px;font-weight:700}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.badge-ic{width:40px;height:40px;border-radius:50%;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#818cf8}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:24px;position:relative;overflow:hidden}
.card .bg{position:absolute;top:0;right:0;padding:16px;opacity:.1}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;position:relative}
.row2{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px;position:relative}
.lbl{color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.1em}
.pct{font-size:40px;font-weight:900}
.pf{font-size:18px;font-weight:800;color:var(--blue)}
.bar{width:100%;background:#020617;height:20px;border-radius:99px;border:1px solid var(--line);padding:4px;margin-bottom:12px}
.bar.thin{height:12px;padding:2px;margin-bottom:14px}
.fill{height:100%;border-radius:99px;transition:width .8s ease-out}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 12px;border-radius:99px;font-weight:700;border:1px solid}
.chip.i{color:#a5b4fc;background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.25)}
.chip.e{color:#6ee7b7;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25)}
.chip.g{color:#fcd34d;background:rgba(234,179,8,.1);border-color:rgba(234,179,8,.3)}
.hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.55}
.tabs{display:flex;background:var(--card);padding:4px;border-radius:18px;border:1px solid var(--line);margin-bottom:24px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0;border-radius:14px;font-size:12px;font-weight:700;color:var(--dim)}
.tab.on{background:#1e293b;color:#fff;border:1px solid #334155;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.list{display:flex;flex-direction:column;gap:16px}
.item{background:rgba(15,23,42,.55);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:left;width:100%;color:inherit}
.cat{font-size:12px;background:#1e293b;color:#818cf8;padding:4px 10px;border-radius:8px;font-weight:900}
.why{font-size:12px;color:var(--green);font-weight:700}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.item h3{font-size:18px;font-weight:700;margin-bottom:4px}
.item p{font-size:13px;color:var(--dim);line-height:1.5}
.ex{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.ex summary{font-size:13px;font-weight:700;color:#a5b4fc;cursor:pointer;padding:4px 0}
.ex .ln{margin-top:10px}
.ex .ln b{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.ex .ln p{color:var(--text);font-size:14px}
.use{margin-top:14px;width:100%;background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.3);border-radius:14px;padding:11px;font-weight:700;font-size:13px}
.selbox label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:0 4px 8px}
select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;color:#fff;font:inherit;font-size:16px;outline:none}
.sec{font-size:13px;font-weight:800;color:var(--mute);margin:4px 4px 0}
.log{display:flex;align-items:center;gap:14px}
.lic{padding:12px;border-radius:16px;display:flex}
.lic.green{background:rgba(16,185,129,.1);color:var(--green)}
.lic.blue{background:rgba(59,130,246,.1);color:var(--blue)}
.lic.red{background:rgba(239,68,68,.1);color:var(--red)}
.lbody{flex:1;min-width:0}
.lt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lt h4{font-size:15px;font-weight:700;color:#e2e8f0}
.date{font-size:12px;color:var(--dim)}
.topic{font-size:13px;color:var(--mute);margin-top:2px;word-break:break-all}
.topic.nx{color:#a5b4fc}
.delta{font-size:12px;font-weight:800;color:var(--orange);white-space:nowrap}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ph h3{font-size:20px;font-weight:900;margin:0}
.pp{display:flex;align-items:center;gap:4px;color:var(--yellow);font-size:13px;font-weight:700;background:rgba(234,179,8,.1);padding:4px 12px;border-radius:99px;border:1px solid rgba(234,179,8,.25)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{font-size:12px;background:#1e293b;color:var(--mute);padding:4px 12px;border-radius:8px}
.note{background:rgba(2,6,23,.5);padding:12px;border-radius:12px;border:1px solid rgba(30,41,59,.6);font-size:13px;color:var(--dim);font-style:italic;white-space:pre-wrap;word-break:break-all}
.stat{font-size:12px;color:var(--dim);margin-top:10px}
.empty{text-align:center;color:var(--dim);padding:40px 10px;font-size:14px;line-height:1.6}
.empty.small{padding:12px 10px;font-size:13px}
.btn{width:100%;padding:14px;border-radius:16px;font-weight:800;font-size:14px;border:1px solid #334155;background:#1e293b}
.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff}
.btn.dan{color:var(--red);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.btns{display:flex;gap:10px}
.fab{position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.fab button{pointer-events:auto;width:100%;max-width:384px;background:var(--ind);padding:18px 20px;border-radius:24px;box-shadow:0 20px 40px rgba(99,102,241,.4);display:flex;align-items:center;justify-content:space-between;color:#fff;text-align:left}
.fab button:active{transform:scale(.96)}
.fl{display:flex;align-items:center;gap:14px}
.fp{background:rgba(255,255,255,.2);padding:8px;border-radius:12px;display:flex}
.fs{font-size:11px;opacity:.8;font-weight:800;line-height:1}
.ft{font-weight:700;font-size:16px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:448px;max-height:92vh;overflow-y:auto;border-radius:36px 36px 0 0;padding:28px 24px 32px;border-top:1px solid var(--line);animation:up .28s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.sh h2{font-size:20px;font-weight:900}
.x{padding:8px;background:#1e293b;border-radius:50%;color:var(--mute);display:flex}
form label{display:block;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em;margin:0 4px 8px}
form .f{margin-bottom:20px}
input,textarea{width:100%;background:#020617;border:1px solid var(--line);border-radius:16px;padding:14px;color:#fff;font:inherit;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ind)}
textarea{resize:none;height:72px}
input[type=range]{padding:0;height:32px;accent-color:var(--ind);border:none;background:none}
.rs{display:flex;gap:8px}
.rb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;border:2px solid var(--line);background:#020617;opacity:.6;font-size:12px;font-weight:800}
.rb small{font-size:11px;font-weight:600;color:var(--dim)}
.rb.on{border-color:var(--ind);background:rgba(99,102,241,.1);opacity:1}
.rb.green{color:var(--green)}.rb.blue{color:var(--blue)}.rb.red{color:var(--red)}
.rb span{color:var(--text)}
.rng{display:flex;align-items:center;gap:12px}
.rng output{min-width:76px;text-align:right;font-weight:800;color:var(--yellow);font-size:14px}
.h2{font-size:12px;color:var(--dim);margin:2px 4px 0}
.err{color:var(--red);font-size:13px;font-weight:700;margin:-8px 4px 16px}
.err[hidden]{display:none}
.nb{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:20px}
.nb summary{font-weight:800;font-size:14px;color:#a5b4fc;cursor:pointer}
.nb .f{margin:14px 0 0}
.top{margin-bottom:16px}
.bk{display:flex;gap:10px;margin-top:20px}
.bk .btn{font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi b{display:block;font-size:22px;font-weight:900}
.kpi span{font-size:12px;color:var(--dim)}
.rep{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.rep h3{font-size:15px;font-weight:800;margin-bottom:14px}
.brow{display:grid;grid-template-columns:22px 1fr 40px;align-items:center;gap:10px;margin-bottom:8px}
.bl{font-size:13px;color:var(--mute);font-weight:700}
.bl.td{color:#fff}
.bt{height:10px;background:#020617;border-radius:99px;overflow:hidden}
.bf{height:100%;background:var(--ind2);border-radius:0 99px 99px 0}
.bv{font-size:12px;color:var(--mute);text-align:right}
.ins{font-size:14px;line-height:1.6;color:var(--text);padding-left:14px;position:relative;margin-bottom:8px}
.ins:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--ind2)}
.prow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.prow:first-of-type{border-top:none}
.prow span{color:var(--dim);font-size:12px;text-align:right}
.rv{padding:10px 0;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:none}
.rv b{font-size:13px;color:var(--mute)}
.rv p{font-size:14px;color:#c7d2fe;margin-top:2px;word-break:break-all}
.warn{background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.3);color:#fdba74;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:16px;line-height:1.5}
</style>
</head>

  function esc(s) {

  function lvl(l) { var n = Number(l && l.energy); return n >= 1 && n <= 5 ? Math.round(n) : 2; } // 구버전 기록은 2단계로 간주
  function cost(l) { return lvl(l) * 5; }
  function energyNow() {
    var t = todayStr();
    var used = logs.filter(function (l) { return l.date === t; }).reduce(function (a, l) { return a + cost(l); }, 0);
    return clamp(100 - used + (Number(recover[t]) || 0));
  }
  function perfToday() {
    var t = todayStr();
    var xs = logs.filter(function (l) { return l.date === t && RESULT[l.result]; });
    if (!xs.length) return null;
    return Math.round(xs.reduce(function (a, l) { return a + RESULT[l.result].perf; }, 0) / xs.length);
  }

  /* ---------- 미션 ---------- */
  function missionById(id) { return ALL_MISSIONS.find(function (m) { return m.id === id; }); }
  function dailyMissions() {
    var t = todayStr(), ids = load('ss_daily_ids', []), d = null;
    try { d = localStorage.getItem('ss_missions_date'); } catch (e) {}
    var valid = Array.isArray(ids) && ids.length === 3 && ids.every(function (i) { return !!missionById(i); });
    if (d !== t || !valid) {
      var arr = ALL_MISSIONS.map(function (m) { return m.id; });
      for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = arr[i]; arr[i] = arr[j]; arr[j] = x; }
      ids = arr.slice(0, 3);
      save('ss_daily_ids', ids);
      try { localStorage.setItem('ss_missions_date', t); } catch (e) {}
    }
    return ids.map(missionById);
  }
  function tagsOf(p) {

  }
  // 관심사 태그 ↔ 주제 키워드 규칙 매칭 (AI 없이)
  function matchFor(p) {
    var tags = tagsOf(p), out = [];
    ALL_MISSIONS.forEach(function (m) {
      var score = 0, first = null;
      tags.forEach(function (t) {

        if (hit) { score++; if (!first) first = t; }
      });
      if (score) out.push({ m: m, tag: first, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score || a.m.id - b.m.id; });
    return out.slice(0, 3);
  }

  /* ---------- 저장 ---------- */
  function saveLog(f) {
    var fd = new FormData(f);
    var name = String(fd.get('name') || '').trim(), topic = String(fd.get('topic') || '').trim();
    if (!name || !topic) return;
    var result = String(fd.get('result') || '');
    if (!RESULT[result]) { var er = document.getElementById('logErr'); if (er) er.hidden = false; return; }
    var editId = f.dataset.id ? Number(f.dataset.id) : null;
    var en = Math.max(1, Math.min(5, Number(fd.get('energy')) || 2));
    var rec = {
      id: editId || Date.now(), date: fd.get('date') || todayStr(), colleague: name, topic: topic, result: result, energy: en,
      said: String(fd.get('said') || '').trim(), mine: String(fd.get('mine') || '').trim(),
      reaction: String(fd.get('reaction') || '').trim(), next: String(fd.get('next') || '').trim()
    };
    if (editId) logs = logs.map(function (l) { return l.id === editId ? rec : l; });
    else logs = [rec].concat(logs);
    if (!people.some(function (p) { return p.name === name; })) {
      people.push({ id: Date.now() + 1, name: name, interest: '', pingpong: 5, note: '' });
    }
    persist(); closeModal(); render();
  }

  function savePerson(f) {
    var fd = new FormData(f);
    var name = String(fd.get('name') || '').trim();
    if (!name) return;
    var editId = f.dataset.id ? Number(f.dataset.id) : null;
    if (people.some(function (p) { return p.name === name && p.id !== editId; })) { alert('이미 같은 이름의 인물이 있어요.'); return; }
    var data = { name: name, interest: String(fd.get('interest') || '').trim(), pingpong: Number(fd.get('pingpong')) || 0, note: String(fd.get('note') || '').trim() };
    if (editId) {
      var old = people.find(function (p) { return p.id === editId; });
      if (old && old.name !== name) logs = logs.map(function (l) { return l.colleague === old.name ? Object.assign({}, l, { colleague: name }) : l; });
      people = people.map(function (p) { return p.id === editId ? Object.assign({}, p, data) : p; });
    } else {
      people = people.concat([Object.assign({ id: Date.now() }, data)]);
    }
    persist(); closeModal(); render();
  }

  // 텍스트(JSON): 들여쓰기·줄바꿈 없이 최소 크기, 완전 복원용
  function exportData() {

  // 엑셀용 CSV: 한 파일에 기록·인물·회복을 '구분' 열로 나눠 담아요 (UTF-8 BOM, 엑셀에서 한글 정상 표시)
  var CSV_HEAD = ['구분', '날짜', '이름', '주제', '결과', '에너지', '상대가 한 말', '내가 한 말', '상대 반응', '다음에 시도할 말', '관심사', '핑퐁점수', '메모'];
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;           // 엑셀 수식 실행 방지
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function unq(s) { return /^'[=+\-@\t\r]/.test(s) ? s.slice(1) : s; }
  function exportCsv() {
    var rows = [CSV_HEAD];
    logs.forEach(function (l) {
      rows.push(['기록', l.date, l.colleague, l.topic, (RESULT[l.result] || RESULT.defense).label, lvl(l), l.said || '', l.mine || '', l.reaction || '', l.next || '', '', '', '']);
    });
    people.forEach(function (p) {
      rows.push(['인물', '', p.name, '', '', '', '', '', '', '', p.interest || '', p.pingpong, p.note || '']);
    });
    Object.keys(recover).sort().forEach(function (d) {
      rows.push(['회복', d, '', '', '', recover[d], '', '', '', '', '', '', '']);
    });
    var text = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n';
    download('social-shield-' + todayStr() + '.csv', new Blob([text], { type: 'text/csv;charset=utf-8' }));
  }
  function parseCsv(t) {
    var rows = [], row = [], f = '', q = false, i = 0, c;
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    for (; i < t.length; i++) {
      c = t.charAt(i);
      if (q) {
        if (c === '"') { if (t.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && t.charAt(i + 1) === '\n') i++;
        row.push(f); f = ''; rows.push(row); row = [];
      } else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x !== ''; }); });
  }
  function normDate(s) {   // 엑셀이 2026/10/8 처럼 바꿔 저장해도 읽어요
    var m = String(s).trim().match(/^(\d{4})[-\/.]\s*(\d{1,2})[-\/.]\s*(\d{1,2})/);
    return m ? m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]) : null;
  }
  function importCsv(text) {
    if (text.indexOf('�') > -1) { alert('글자가 깨졌어요. 엑셀에서 "CSV UTF-8"로 저장한 파일만 불러올 수 있어요.'); return; }
    var rows = parseCsv(text), head = rows.shift() || [], ix = {};
    head.forEach(function (n, i) { ix[String(n).replace(/^﻿/, '').trim()] = i; });
    if (ix['구분'] == null) { alert('이 앱에서 내보낸 CSV 형식이 아니에요.'); return; }
    var g = function (r, n) { var i = ix[n]; return i == null ? '' : unq(String(r[i] == null ? '' : r[i])); };
    var key = {}; Object.keys(RESULT).forEach(function (k) { key[RESULT[k].label] = k; });
    var L = [], P = [], R = {}, skipped = 0, base = Date.now();
    rows.forEach(function (r) {
      var kind = g(r, '구분').trim();
      if (kind === '기록') {
        var d = normDate(g(r, '날짜')), res = key[g(r, '결과').trim()], name = g(r, '이름').trim(), topic = g(r, '주제').trim();
        if (!d || !res || !name || !topic) { skipped++; return; }
        L.push({ id: 0, date: d, colleague: name, topic: topic, result: res, energy: Math.max(1, Math.min(5, Math.round(Number(g(r, '에너지'))) || 2)),
          said: g(r, '상대가 한 말'), mine: g(r, '내가 한 말'), reaction: g(r, '상대 반응'), next: g(r, '다음에 시도할 말') });
      } else if (kind === '인물') {
        var pn = g(r, '이름').trim();
        if (!pn || P.some(function (p) { return p.name === pn; })) { skipped++; return; }
        P.push({ id: base + 100000 + P.length, name: pn, interest: g(r, '관심사'), pingpong: Math.max(0, Math.min(10, Number(g(r, '핑퐁점수')) || 0)), note: g(r, '메모') });
      } else if (kind === '회복') {
        var rd = normDate(g(r, '날짜')), rv = Number(g(r, '에너지'));
        if (rd && isFinite(rv) && rv > 0) R[rd] = Math.min(100, rv); else skipped++;
      } else skipped++;
    });
    if (!L.length && !P.length) { alert('불러올 데이터가 없어요.'); return; }
    if (!confirm('기록 ' + L.length + '건, 인물 ' + P.length + '명으로 현재 데이터를 덮어쓸까요?' + (skipped ? '\n(읽지 못한 줄 ' + skipped + '개는 건너뜀)' : ''))) return;
    L.forEach(function (l, i) { l.id = base + (L.length - i); });   // 파일 순서(최신순) 유지
    L.forEach(function (l) {
      if (!P.some(function (p) { return p.name === l.colleague; })) P.push({ id: base + 200000 + P.length, name: l.colleague, interest: '', pingpong: 5, note: '' });
    });
    logs = L; people = P; recover = R;
    persist(); render();
  }
  function importData(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || !Array.isArray(d.logs) || !Array.isArray(d.people)) throw new Error('bad');
        if (!confirm('현재 데이터를 백업 파일 내용으로 덮어쓸까요?')) return;
        logs = d.logs.map(function (l, i) {
          return {
            id: Number(l.id) || Date.now() + i, date: String(l.date || todayStr()), colleague: String(l.colleague || ''), topic: String(l.topic || ''),
            result: RESULT[l.result] ? l.result : 'defense', energy: Math.max(1, Math.min(5, Number(l.energy) || 2)),
            said: String(l.said || ''), mine: String(l.mine || ''), reaction: String(l.reaction || ''), next: String(l.next || '')
          };
        });
        people = d.people.map(function (p, i) {
          return { id: Number(p.id) || Date.now() + i, name: String(p.name || ''), interest: String(p.interest || ''), pingpong: Number(p.pingpong) || 0, note: String(p.note || '') };
        });
        var rc = {};
        if (d.recover && typeof d.recover === 'object' && !Array.isArray(d.recover)) {
          Object.keys(d.recover).forEach(function (k) { var v = Number(d.recover[k]); if (isFinite(v) && v > 0) rc[String(k)] = Math.min(100, v); });
        }
        recover = rc;
        persist(); render();
      } catch (e) { alert('올바른 백업 파일이 아니에요.'); }
    };
    rd.readAsText(file);
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    if (e.target === overlay) { closeModal(); return; }
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var a = el.dataset.a, v = el.dataset.v;
    if (a === 'tab') { tab = v; render(); }
    else if (a === 'add-log') openLogModal(null);
    else if (a === 'use-mission') openLogModal(null, v, el.dataset.p);
    else if (a === 'edit-log') openLogModal(Number(v));
    else if (a === 'add-person') openPersonModal(null);
    else if (a === 'edit-person') openPersonModal(Number(v));
    else if (a === 'close') closeModal();
    else if (a === 'pick') {
      var form = el.closest('form');
      form.querySelector('input[name=result]').value = v;
      form.querySelectorAll('.rb').forEach(function (b) { b.classList.toggle('on', b === el); });
      var er = document.getElementById('logErr'); if (er) er.hidden = true;
    }
    else if (a === 'recover') { var t = todayStr(); recover[t] = Math.min(100, (Number(recover[t]) || 0) + 10); persist(); render(); }
    else if (a === 'recover-reset') { delete recover[todayStr()]; persist(); render(); }
    else if (a === 'del-log') {
      if (confirm('이 기록을 삭제할까요?')) { logs = logs.filter(function (l) { return l.id !== Number(v); }); persist(); closeModal(); render(); }
    }
    else if (a === 'del-person') {
      if (confirm('인물 카드를 삭제할까요? 이 사람의 기록은 오답 노트에 남아요.')) {
        people = people.filter(function (p) { return p.id !== Number(v); });
        if (forPerson === Number(v)) forPerson = null;
        persist(); closeModal(); render();
      }
    }
    else if (a === 'export') exportData();
    else if (a === 'export-csv') exportCsv();
    else if (a === 'import') importFile.click();
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'logForm') saveLog(e.target);
    else if (e.target.id === 'personForm') savePerson(e.target);
  });

  document.addEventListener('input', function (e) {
    if (e.target.name === 'pingpong') document.getElementById('ppv').textContent = Number(e.target.value).toFixed(1);
    if (e.target.name === 'energy') { var n = Number(e.target.value); document.getElementById('env').textContent = n + '단계 −' + (n * 5) + '%'; }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'forPerson') { forPerson = e.target.value ? Number(e.target.value) : null; render(); }
  });

  importFile.addEventListener('change', function () {
    var f = importFile.files && importFile.files[0];
    if (f) {
      if (f.size > 5 * 1024 * 1024) alert('파일이 너무 커요(5MB 초과).');
      else if (/\.csv$/i.test(f.name)) { var rd = new FileReader(); rd.onload = function () { importCsv(String(rd.result)); }; rd.readAsText(f, 'UTF-8'); }
      else importData(f);
    }
    importFile.value = '';
  });

  render();
})();
</script>
</body>
</html>
